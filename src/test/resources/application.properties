spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=org.h2.Driver
spring.sql.init.mode=always

app.scheduler.await-termination-seconds=1
majordomo.base-dir=${java.io.tmpdir}/majordomo-test
majordomo.skip-gemini-trust=true
server.port=0
