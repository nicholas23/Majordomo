<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Majordomo 工作區管理系統</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- UI UX Pro Max Theme Overrides -->
    <link href="/css/theme.css" rel="stylesheet">
</head>

<body class="d-flex">

    <!-- Sidebar Navigation -->
    <div class="d-flex flex-column flex-shrink-0 p-3 text-bg-dark border-end border-secondary-subtle"
        style="width: 280px; height: 100vh;">
        <div class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
            <div class="brand-logo cursor-pointer fs-4 d-flex align-items-center" hx-get="/" hx-target="body"
                hx-push-url="true" style="cursor: pointer;">
                <i data-lucide="box" class="text-primary me-2"></i>
                <span class="fs-5 fw-bold">Majordomo</span>
            </div>
        </div>
        <hr>

        <div class="flex-column mb-auto overflow-auto">
            <div class="d-flex justify-content-between align-items-center px-4 mt-4">
                <span class="nav-section-title m-0 p-0 text-secondary fw-semibold text-uppercase"
                    style="font-size: 0.75rem;">工作區列表</span>
                <button class="btn btn-sm btn-outline-secondary border-0" hx-get="/web/workspace/new"
                    hx-target="#workspace-display" title="新增工作區">
                    <i data-lucide="plus"></i>
                </button>
            </div>

            <div id="workspace-list-container" th:insert="~{fragments/workspace_list :: list}"
                hx-get="/web/workspace/list" hx-trigger="newWorkspaceCreated from:body">
                <!-- Workspace list loaded here -->
            </div>
        </div>

        <div class="mt-auto p-3 border-top border-secondary-subtle">
            <div class="d-flex align-items-center gap-2 small text-secondary">
                <i data-lucide="info" style="width: 16px; height: 16px;"></i>
                <span>v0.1.0</span>
            </div>
        </div>
    </div>

    <!-- Main Content Wrapper -->
    <div class="d-flex flex-column flex-grow-1 overflow-hidden" style="height: 100vh;">
        <!-- Top Header -->
        <header
            class="d-flex justify-content-between align-items-center p-3 border-bottom border-secondary-subtle bg-dark text-white">
            <h1 class="fw-semibold fs-5 m-0"></h1>
            <div class="d-flex align-items-center gap-3">
                <div class="htmx-indicator spinner-border spinner-border-sm text-primary" role="status"
                    id="global-loader">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <!-- Agent Chat Link -->
                <button class="btn btn-sm btn-outline-secondary" th:title="'與 ' + (${agentName} ?: 'Agent') + ' 對話'"
                    hx-get="/web/agent/chat" hx-target="#workspace-display" hx-swap="innerHTML transition:true">
                    <i data-lucide="bot-message-square" class="text-primary me-2"></i>
                </button>
                <button class="btn btn-sm btn-outline-secondary" title="系統設定" hx-get="/web/settings"
                    hx-target="#workspace-display" hx-swap="innerHTML transition:true">
                    <i data-lucide="settings"></i>
                </button>
                <button class="btn btn-sm btn-outline-secondary" title="執行記錄" hx-get="/web/workspace/-1/history"
                    hx-target="#workspace-display" hx-swap="innerHTML transition:true">
                    <i data-lucide="logs"></i>
                </button>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <main class="flex-grow-1 overflow-auto bg-dark text-body" id="workspace-display">
            <!-- WHY: 若已設定 BasicAgent，首頁透過 HTMX 自動載入 Agent 資訊頁，以確保取得完整 Model 資料 (如 heartbeat) -->
            <div th:if="${hasBasicAgent}" hx-get="/web/agent/info" hx-trigger="load" hx-swap="outerHTML">
                <div class="d-flex justify-content-center align-items-center h-100 p-5">
                    <div class="spinner-border text-secondary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>

            <div th:unless="${hasBasicAgent}"
                class="d-flex flex-column align-items-center justify-content-center h-100 text-center p-5">
                <div
                    class="mb-4 p-4 bg-dark-subtle rounded-circle border border-secondary-subtle text-secondary shadow-sm">
                    <i data-lucide="layout-dashboard" style="width: 3rem; height: 3rem;"></i>
                </div>
                <h2 class="fs-3 fw-bold mb-3">歡迎使用 Majordomo 管理系統</h2>
                <p class="text-secondary mb-5" style="max-width: 500px;">
                    請從左側側邊欄選擇一個工作區以開始管理任務，或建立你的 AI 助理。
                </p>
                <div class="d-flex gap-3">
                    <button class="btn btn-primary d-flex align-items-center gap-2" hx-get="/web/agent/setup"
                        hx-target="#workspace-display">
                        <i data-lucide="bot"></i>
                        設定 AI 助理
                    </button>
                    <button class="btn btn-outline-secondary d-flex align-items-center gap-2"
                        hx-get="/web/workspace/new" hx-target="#workspace-display">
                        <i data-lucide="plus"></i>
                        建立工作區
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();

        // Re-initialize plugins/icons after HTMX swaps
        document.body.addEventListener('htmx:afterSwap', function (event) {
            lucide.createIcons();
        });
    </script>
</body>

</html>
