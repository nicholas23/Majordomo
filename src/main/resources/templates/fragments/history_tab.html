<div xmlns:th="http://www.thymeleaf.org" class="d-flex h-100" style="min-height: 500px;">
    <!-- Left: History List -->
    <div class="border-end border-secondary d-flex flex-column h-100" style="width: 320px; flex-shrink: 0;">
        <div class="p-3 border-bottom border-secondary bg-dark-subtle fw-semibold small text-secondary text-uppercase"
            style="letter-spacing: 0.05em;">
            執行紀錄列表
        </div>
        <div class="overflow-y-auto flex-grow-1 bg-dark"
            style="scrollbar-width: thin; scrollbar-color: #495057 #212529;">
            <div th:each="h : ${histories}" class="p-3 border-bottom border-secondary-subtle bg-dark text-white"
                th:attr="hx-get='/web/history/' + ${h.id} + '/detail'" hx-target='#history-detail'
                onclick="document.querySelectorAll('.history-item').forEach(el => { el.classList.remove('bg-secondary'); el.classList.add('bg-dark'); }); this.classList.remove('bg-dark'); this.classList.add('bg-secondary');"
                style="cursor: pointer;" th:classappend="'history-item'">

                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="small text-secondary font-monospace"
                        th:text="${#temporals.format(h.startTime, 'MM/dd HH:mm')}">Date</span>
                    <span class="badge" th:classappend="${h.status?.name() == 'RUNNING' ? 'text-bg-primary' :
                                           h.status?.name() == 'COMPLETED' ? 'text-bg-success' :
                                           h.status?.name() == 'FAILED' ? 'text-bg-danger' :
                                           h.status?.name() == 'TERMINATED' ? 'text-bg-warning' : 'text-bg-secondary'}"
                        th:text="${h.status != null ? h.status.name() : 'UNKNOWN'}">Status</span>
                </div>
                <div class="small fw-medium text-white text-truncate font-monospace" th:text="${h.command}">Command
                </div>
            </div>
            <!-- Empty State -->
            <div th:if="${histories.size() == 0}" class="p-5 text-center text-secondary small">
                尚無執行紀錄
            </div>
        </div>
    </div>

    <!-- Right: History Detail -->
    <div class="flex-grow-1 d-flex flex-column h-100 overflow-hidden bg-dark" id="history-detail">
        <div
            class="flex-grow-1 d-flex flex-column align-items-center justify-content-center text-center p-5 text-secondary">
            <div class="mb-4 p-4 bg-dark-subtle rounded-circle">
                <i data-lucide="file-text" class="text-secondary" style="width: 2rem; height: 2rem;"></i>
            </div>
            <p>請從左側選擇一筆紀錄查看細節</p>
        </div>

        <script>
            lucide.createIcons();
        </script>
    </div>
</div>
