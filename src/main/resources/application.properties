server.port=8088
spring.ai.mcp.server.name=MajordomoMcpServer
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC

spring.datasource.url=jdbc:h2:${user.home}/.majordomo/data/database;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.dialect=org.hibernate.dialect.MySQLDialect;
spring.sql.init.mode=always